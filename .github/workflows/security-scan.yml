name: SecurAI Security Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    name: Run security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Gitleaks ────────────────────────────────
      - name: Gitleaks - scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Semgrep (standalone scan, no token needed) ─
      - name: Semgrep - SAST scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/php \
              --config p/javascript \
              --config p/secrets \
              --sarif --output semgrep.sarif

      # ── Verify SARIF exists ─────────────────────
      - name: Check SARIF output
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "✅ semgrep.sarif created ($(wc -c < semgrep.sarif) bytes)"
          else
            echo "⚠️ semgrep.sarif not found — creating empty file for upload"
            echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
          fi

      # ── Upload SARIF to GitHub Security tab ─────
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ── Composer audit ──────────────────────────
      - name: Composer audit
        if: hashFiles('composer.lock') != ''
        continue-on-error: true
        run: |
          composer audit --format=json --no-dev > composer-audit.json || true

      # ── npm audit ───────────────────────────────
      - name: npm audit
        if: hashFiles('package-lock.json') != ''
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true

      # ── Build HTML report ───────────────────────
      - name: Build HTML report
        if: always()
        run: |
          mkdir -p security-report
          python3 .github/scripts/build-report.py || {
            echo "::warning::build-report.py failed — creating fallback report"
            echo "<html><body><h1>Security report unavailable</h1></body></html>" > security-report/index.html
          }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securAI-report
          path: security-report/

      # ── Post PR comment ─────────────────────────
      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🛡️ SecurAI Security Scan\n\n';
            try {
              body += fs.readFileSync('summary.md', 'utf8')
                .replace(/^## 🛡️ SecurAI Scan\n\n/, '');
            } catch (e) {
              body += '_No summary generated._\n';
            }
            body += '\n📄 **Full report:** download the `securAI-report` artifact from the Actions tab.\n';
            body += '\n— [SecurAI Audit Tool](https://ElhamBidarigh.github.io/securai/)';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ── Fail on critical findings ───────────────
      - name: Fail on critical findings
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            COUNT=$(jq '[.runs[].results[] | select(.level=="error")] | length' semgrep.sarif 2>/dev/null || echo 0)
            echo "Critical (error-level) findings: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::$COUNT critical security issues found."
              exit 1
            fi
          else
            echo "No SARIF file to check."
          fi
